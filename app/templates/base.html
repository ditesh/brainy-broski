<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Olympiad Practice{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" content="#3b6cf0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="/static/favicon.svg" alt=""> Olympiad Practice</a>
    {% if user %}
    <nav>
      {% if user.role.value == "parent" %}<a href="/parent">📚 Papers</a>{% else %}<a href="/practice">🚀 Practice</a>{% endif %}
      <a href="/progress">📈 Progress</a>
      <form method="post" action="/logout" class="inline"><button class="link">Log out {{ user.display_name }}</button></form>
    </nav>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script>
  function renderMath(el) {
    if (window.renderMathInElement) renderMathInElement(el, {delimiters: [
      {left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}], throwOnError: false});
  }
  window.addEventListener("load", function () { renderMath(document.body); });
  document.addEventListener("htmx:afterSwap", function (e) { renderMath(e.target); });
  </script>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script>
  document.addEventListener("htmx:responseError", function (e) {
    var t = document.getElementById("toast"), tmp = document.createElement("div");
    tmp.innerHTML = e.detail.xhr.responseText || "";
    var title = tmp.querySelector(".alert-title"), msg = tmp.querySelector(".alert-msg");
    t.innerHTML = "<strong>😕 " + (title ? title.textContent : "That didn't work") + "</strong>" +
      (msg ? "<br>" + msg.textContent : "<br>Please try again.");
    t.hidden = false; clearTimeout(t._h); t._h = setTimeout(function () { t.hidden = true; }, 6000);
  });
  document.addEventListener("htmx:sendError", function () {
    var t = document.getElementById("toast");
    t.innerHTML = "<strong>📡 No connection</strong><br>Check the internet and try again.";
    t.hidden = false; clearTimeout(t._h); t._h = setTimeout(function () { t.hidden = true; }, 6000);
  });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
