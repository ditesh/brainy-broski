{% extends "base.html" %}
{% from "macros.html" import alert %}
{% block content %}
<h1>Ready for some maths? 🧮</h1>
{% if error %}{{ alert("error", error) }}{% endif %}
<form method="post" action="/login" class="stack">
  <label>Username <input name="username" autocomplete="username" autocapitalize="none" required></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="primary">Let's go! →</button>
</form>
{% endblock %}
