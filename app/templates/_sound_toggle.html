{# Mute/unmute for kids. Needs: user, request. #}
{% if user and user.role.value == "child" %}
{% set on = user.sound_on is not false %}
<form method="post" action="/sound" class="sound-toggle">
  <input type="hidden" name="on" value="{{ '0' if on else '1' }}">
  <input type="hidden" name="next" value="/account">
  <button aria-pressed="{{ 'true' if on else 'false' }}">{{ "🔊 Sound on — tap to turn off" if on else "🔇 Sound off — tap to turn on" }}</button>
</form>
{% endif %}
